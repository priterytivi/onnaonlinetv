<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Test M3U8 Player</title>

  <!-- Video.js CSS -->
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet">

  <!-- Player của bạn -->
  <script src="https://blobs.livepush.io/embeds/player.vod.videojs.latest.js"></script>

  <style>
    body {
      margin: 0;
      background: #000;
    }
    .video-js {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

  <video
    id="player"
    class="video-js vjs-default-skin"
    controls
    autoplay
    playsinline>
  </video>

  <script>
    // Lấy link m3u8 từ ?url=
    const params = new URLSearchParams(window.location.search);
    const m3u8Url = params.get("url");

    if (!m3u8Url) {
      alert("Thiếu tham số ?url=link_m3u8");
    } else {
      const player = videojs("player");
      player.src({
        src: m3u8Url,
        type: "application/x-mpegURL"
      });
    }
  </script>

</body>
</html>

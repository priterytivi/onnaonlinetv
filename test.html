<!DOCTYPE html><html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPTV Player</title>  <style>
    :root {
      --bg: #000;
      --white: #fff;
      --gray: #777;
      --card: #111;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--white);
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 12px;
    }

    .player-wrap {
      border-radius: 20px;
      overflow: hidden;
      background: #000;
      margin-bottom: 12px;
    }

    #player {
      width: 100%;
      aspect-ratio: 16/9;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      border-radius: 14px;
      background: var(--gray);
      cursor: pointer;
      user-select: none;
    }

    .tab.active {
      background: var(--white);
      color: #000;
    }

    .section-title {
      margin: 18px 0 10px;
      font-weight: bold;
      font-size: 18px;
    }

    .grid {
      display: grid;
      gap: 12px;
    }

    @media (max-width: 768px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (min-width: 769px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    .card img {
      width: 100%;
      display: block;
    }

    .info {
      padding: 8px;
      font-size: 14px;
    }

    .views {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,0.6);
      padding: 4px 6px;
      border-radius: 8px;
      font-size: 12px;
    }

    .epg { display: none; }

    .epg-item {
      background: #111;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 8px;
    }
  </style></head>
<body><div class="container">  <!-- Player -->  <div class="player-wrap">
    <div id="player"></div>
  </div>  <!-- Tabs (CHỈ 2 NÚT) -->  <div class="tabs">
    <div class="tab active" id="tab-tv">Truyền Hình</div>
    <div class="tab" id="tab-epg">Lịch Phát Sóng</div>
  </div>  <!-- Truyền hình + Phát thanh -->  <div id="tv-section">
    <div class="section-title">Truyền Hình</div>
    <div class="grid" id="tv-channels"></div><div class="section-title">Phát Thanh</div>
<div class="grid" id="radio-channels"></div>

  </div>  <!-- EPG -->  <div class="epg" id="epg-section"></div></div><script src="https://onnaonlinetv.xyz/playerjs.js"></script><script>
  const IPTV_URL = '/iptv.m3u';

  const tvGrid = document.getElementById('tv-channels');
  const radioGrid = document.getElementById('radio-channels');
  const epgSection = document.getElementById('epg-section');

  const tabTV = document.getElementById('tab-tv');
  const tabEPG = document.getElementById('tab-epg');

  let channels = [];
  let player = null;

  async function loadIPTV() {
    const res = await fetch(IPTV_URL);
    const text = await res.text();
    parseM3U(text);
    renderChannels();
    if (channels[0]) playChannel(channels[0].url);
  }

  function parseM3U(data) {
    const lines = data.split('
');
    let current = null;

    lines.forEach(line => {
      if (line.startsWith('#EXTINF')) {
        current = {
          name: line.split(',').pop().trim(),
          logo: (line.match(/tvg-logo="(.*?)"/) || [])[1],
          group: (line.match(/group-title="(.*?)"/) || [])[1],
          viewers: Math.floor(Math.random() * 300) + 1
        };
      } else if (current && line.startsWith('http')) {
        current.url = line.trim();
        channels.push(current);
        current = null;
      }
    });
  }

  function playChannel(url) {
    if (!url) return;
    if (!player) {
      player = new Playerjs({ id: 'player', file: url });
    } else {
      player.api('play', url);
    }
  }

  function renderChannels() {
    tvGrid.innerHTML = '';
    radioGrid.innerHTML = '';

    channels.forEach(ch => {
      if (!ch.group || !ch.name) return;

      const g = ch.group.toLowerCase();
      if (!g.includes('tv') && !g.includes('radio')) return;

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${ch.logo || 'https://via.placeholder.com/300x170?text=No+Logo'}">
        <div class="views">👁 ${ch.viewers}</div>
        <div class="info">${ch.name}</div>
      `;
      card.onclick = () => playChannel(ch.url);

      if (g.includes('radio')) radioGrid.appendChild(card);
      else tvGrid.appendChild(card);
    });
  }

  tabTV.onclick = () => {
    tabTV.classList.add('active');
    tabEPG.classList.remove('active');
    document.getElementById('tv-section').style.display = 'block';
    epgSection.style.display = 'none';
  };

  tabEPG.onclick = () => {
    tabEPG.classList.add('active');
    tabTV.classList.remove('active');
    document.getElementById('tv-section').style.display = 'none';
    epgSection.style.display = 'block';
    epgSection.innerHTML = '<div class="epg-item">Chưa tích hợp EPG XMLTV</div>';
  };

  loadIPTV();
</script></body>
</html>

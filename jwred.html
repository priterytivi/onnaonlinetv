<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://live.qphim.xyz/tv/player.js"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
}

#player {
    width: 100%;
    height: 100vh;
}

.jw-progress {
    background-color: #ff0000 !important;
}
.jw-buffer {
    background-color: rgba(255,0,0,0.4) !important;
}
.jw-icon-playback,
.jw-icon-volume,
.jw-icon-settings,
.jw-icon-fullscreen {
    color: #ff0000 !important;
}
.jw-icon:hover {
    color: #ff3b3b !important;
}
.jw-controlbar {
    background: linear-gradient(
        to top,
        rgba(0,0,0,0.85),
        rgba(0,0,0,0.3)
    ) !important;
}
.jw-slider-time {
    height: 4px !important;
}
.jw-logo {
    display: none !important;
}
</style>
</head>

<body>

<div id="player"></div>

<script>

const params = new URLSearchParams(window.location.search);
const videoUrl = params.get("url");

if (!videoUrl) {
    document.body.innerHTML = "<h3 style='color:red;text-align:center'>Thiếu tham số ?url=</h3>";
} else {
    jwplayer("player").setup({
        file: decodeURIComponent(videoUrl),
        width: "100%",
        height: "100%",
        autostart: true,
        mute: false,
        controls: true,
        stretching: "uniform",
        primary: "html5",
        preload: "auto",

        skin: {
            active: "#ff0000",
            inactive: "#ffffff",
            background: "rgba(0,0,0,0.6)"
        }
    });
}

jwplayer().on("ready", function () {
    const player = jwplayer();
    document.addEventListener("keydown", e => {
        if (e.key === "ArrowLeft") {
            player.seek(player.getPosition() - 10);
        }
        if (e.key === "ArrowRight") {
            player.seek(player.getPosition() + 10);
        }
    });
});
</script>

</body>
</html>

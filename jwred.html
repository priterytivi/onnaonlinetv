<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>JWPlayer Test</title>
  <script src="https://ssl.p.jwpcdn.com/player/v/8.34.1/jwplayer.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #player {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      z-index: 9999;
    }
    .error {
      color: #fff;
      font-family: Arial, sans-serif;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="player"></div>
  <div id="error" class="error"></div>

  <script>
    // 🔗 Lấy tham số ?url=
    const params = new URLSearchParams(window.location.search);
    const videoURL = params.get("url");

    if (videoURL) {
      jwplayer("player").setup({
        file: videoURL,
        width: "100%",
        height: "100%",
        autostart: true,
        controls: true,
        stretching: "fill",
        preload: "auto",
        skin: { name: "seven" },
        mute: false,
        displaytitle: false,
        abouttext: "ONNA Player",
        aboutlink: "https://onnaonline.42web.io"
      });

      // 🚀 Tự fullscreen thật trên các thiết bị hỗ trợ
      jwplayer("player").on("ready", function() {
        const elem = document.getElementById("player");
        if (elem.requestFullscreen) elem.requestFullscreen();
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
      });

    } else {
      document.getElementById("error").innerHTML = `
        <h2>Không có link video!</h2>
        <p>Vui lòng truy cập theo dạng:<br>
        <code>?url=https://saygex69.xxx/video.m3u8</code></p>`;
    }
  </script>
</body>
</html>
